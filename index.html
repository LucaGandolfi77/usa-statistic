        * {

        }

        body {

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .back-button {
            position: absolute;
            left: 20px;
            top: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }

        .back-button.active {
            display: block;
        }

        .map-container {
            padding: 20px;
            background: #f8f9fa;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #map {
            width: 100%;
            height: auto;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        #stateOverlays {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            z-index: 2;
            pointer-events: none;
        }

        .state-path {
            fill: #ffffff;
            stroke: #000000;
            stroke-width: 0.5;
            cursor: pointer;
        }

        .state-overlay {
            position: absolute;
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            cursor: pointer;
            z-index: 10;
        }

        .stats-container {
            padding: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            font-size: 18px;
            color: #333;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>

        // Carica la popolazione dagli open data Census
        async function fetchPopulation() {
            try {
                const res = await fetch('https://api.census.gov/data/2020/dec/pl?get=NAME,POP&for=state:*');
                const data = await res.json();
                // data[0] sono le intestazioni
                for (let i = 1; i < data.length; i++) {
                    const [name, pop, , stateCode] = data[i];
                    if (censusStateCodes[stateCode]) {
                        populationByState[censusStateCodes[stateCode]] = parseInt(pop).toLocaleString();
                    }
                }
            } catch (e) {
                console.error('Errore caricamento popolazione:', e);
            }
        }

        // Carica il PIL da BEA API
        async function fetchGDP() {
            const API_KEY = 'YOUR_BEA_API_KEY'; // Sostituire con la tua API key
            try {
                const res = await fetch(`https://apps.bea.gov/api/data/?UserID=${API_KEY}&method=GetData&datasetname=Regional&TableName=SQGDP2&GeoFips=STATE&Year=2023`);
                const data = await res.json();
                data.BEAAPI.Results.Data.forEach(record => {
                    const stateName = censusStateCodes[record.GeoFips];
                    if (stateName) {
                        gdpByState[stateName] = parseFloat(record.DataValue).toLocaleString() + " M$";
                    }
                });
            } catch (e) {
                console.error('Errore caricamento PIL:', e);
            }
        }

        // Carica dati meteo da OpenWeatherMap API
        async function fetchWeather() {
            const API_KEY = 'YOUR_OPENWEATHERMAP_API_KEY';
            try {
                for (const [stateName, coords] of Object.entries(stateCapitalCoords)) {
                    const res = await fetch(
                        `https://api.openweathermap.org/data/2.5/weather?lat=${coords.lat}&lon=${coords.lon}&appid=${API_KEY}&units=imperial`
                    );
                    const data = await res.json();
                    weatherByState[stateName] = {
                        temp: Math.round(data.main.temp) + '°F',
                        conditions: data.weather[0].main,
                        humidity: data.main.humidity + '%'
                    };
                }
            } catch (e) {
                console.error('Errore caricamento dati meteo:', e);
            }
        }

        // Carica dati educativi da NCES API
        async function fetchEducation() {
            const API_KEY = 'YOUR_NCES_API_KEY';
            try {
                const res = await fetch('https://api.ies.ed.gov/api/v1/CCD/Public_school_characteristics', {
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`
                    }
                });
                const data = await res.json();
                data.forEach(record => {
                    if (record.state && record.total_schools && record.total_students) {
                        educationByState[record.state] = {
                            schools: record.total_schools.toLocaleString(),
                            students: record.total_students.toLocaleString(),
                            studentTeacherRatio: record.student_teacher_ratio
                        };
                    }
                });
            } catch (e) {
                console.error('Errore caricamento dati educativi:', e);
            }
        }

                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Registration-Key': API_KEY
                    },
                    body: JSON.stringify({
                        'seriesid': ['LASST010000000000003'], // Serie per ogni stato
                        'startyear': '2023',
                        'endyear': '2023'
                    })
                });
                const data = await res.json();

                    const stateName = censusStateCodes[stateCode];
                    if (stateName && series.data[0]) {
                        unemploymentByState[stateName] = series.data[0].value + "%";
                    }
                });
            } catch (e) {

                const svgRect = svg.getBoundingClientRect();

                button.style.left = (bbox.x * scale) + 'px';
                button.style.top = (bbox.y * scale) + 'px';
                button.style.width = (bbox.width * scale) + 'px';
                button.style.height = (bbox.height * scale) + 'px';

        function createStateMap(stateId) {
            const svg = document.getElementById('map');
            svg.innerHTML = '';
            svg.setAttribute('viewBox', '0 0 400 400');

            // Simplified state outline
            const stateMaps = {
                california: 'M50,50 L50,350 L200,380 L220,350 L200,50 Z',
                texas: 'M50,150 L50,350 L350,350 L350,200 L200,150 Z',
                florida: 'M50,150 L200,150 L250,300 L200,350 L50,320 Z',
                newyork: 'M50,100 L300,100 L320,250 L200,300 L50,250 Z',
                pennsylvania: 'M50,150 L350,150 L350,300 L50,300 Z'
            };

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', stateMaps[stateId] || stateMaps.california);
            path.setAttribute('fill', '#667eea');
            path.setAttribute('stroke', '#ffffff');
            path.setAttribute('stroke-width', '2');
            
            svg.appendChild(path);
        }

        function showUSAMap() {
            currentView = 'usa';
            document.getElementById('backBtn').classList.remove('active');
            document.getElementById('headerTitle').textContent = 'USA Statistics';
            document.getElementById('headerSubtitle').textContent = 'Tap a state to explore';
            createUSAMap();
            // Mostra dati USA, popolazione aggregata (sommata)
            let usaPop = Object.values(populationByState).reduce((acc, val) => acc + parseInt(val.replace(/,/g, '')), 0);
            let usaData = {
                ...staticData.usa,
                population: usaPop ? usaPop.toLocaleString() : '—',
                gdp: '—'
            };
            displayStats(usaData);
        }

        function showStateDetails(stateId) {
            currentView = stateId;
            // Ricava nome stato
            const stateName = stateMapping[stateId];
            const staticState = staticData.states[stateName] || {};
            const stateData = {
                ...staticState,
                name: stateName,
                population: populationByState[stateName] || '—',
                gdp: '—'
            };
            document.getElementById('backBtn').classList.add('active');
            document.getElementById('headerTitle').textContent = stateData.name;
            document.getElementById('headerSubtitle').textContent = 'State Statistics';
            createStateMap(stateId);
            displayStats(stateData);
        }

        function displayStats(data) {
            const container = document.getElementById('statsContainer');
            container.innerHTML = '';
            container.classList.add('fade-in');

            const stats = [
                { label: 'Population', value: data.population },
                { label: 'Area', value: data.area },
                { label: 'Capital', value: data.capital },
                { label: 'GDP', value: gdpByState[data.name] || '—' },
                { label: 'Unemployment Rate', value: unemploymentByState[data.name] || '—' },
                { 
                    label: 'Weather', 
                    value: weatherByState[data.name] 
                        ? `${weatherByState[data.name].temp} - ${weatherByState[data.name].conditions}`
                        : '—'
                },
                { 
                    label: 'Education',
                    value: educationByState[data.name]
                        ? `${educationByState[data.name].schools} schools, ${educationByState[data.name].students} students`
                        : '—'
                },
                { 
                    label: 'Student/Teacher Ratio',
                    value: educationByState[data.name]
                        ? `${educationByState[data.name].studentTeacherRatio}:1`
                        : '—'
                },
                { label: 'Highest Point', value: data.highestPoint },
                { label: 'Founded', value: data.founded }
            ];

            stats.forEach(stat => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-label">${stat.label}</div>
                    <div class="stat-value">${stat.value}</div>
                `;
                container.appendChild(card);
            });

            setTimeout(() => container.classList.remove('fade-in'), 500);
        }

    // Inizializza app: carica tutti i dati, poi mostra mappa
    Promise.all([
        fetchPopulation(),
        fetchGDP(),
        fetchUnemployment(),
        fetchWeather(),
        fetchEducation()
    ]).then(() => {
        showUSAMap();
    });
